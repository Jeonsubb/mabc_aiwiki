[project]
name = "mabc-wiki-mcp"
version = "0.1.0"
description = "MABC AI 위키 MVP용 MCP 서버 (PRD 4.1.1 흐름: Solar/에이전트 → 위키 보관·제안·승인)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.1",
    "mcp",
    "uvicorn>=0.52.4",
]

[project.scripts]
mabc-wiki-mcp = "mcp_server.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server"]
